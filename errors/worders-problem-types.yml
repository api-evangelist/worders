    title: Resource not found
    detail: Returned for unknown invoice, order, quote, purchase order, customer, or template ids (including a quote id passed to the order endpoint).
    source_operations:
      - GET /V1/invoices/{id}
      - POST /V1/orders
      - GET /V1/orders/{id}
      - GET /V1/purchase_orders/{po_number}
