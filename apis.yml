aid: worders
name: Worders
description: >-
  Worders is a culturalization and localization company (a Partech portfolio
  company) that crafts translated, culturally-adapted content for global
  brands with in-country linguists. Alongside the services business it runs a
  Ruby on Rails translation-management platform (admin.worders.net) and
  publishes the Worders API V1 at api.worders.net — an OpenAPI 3.0.1-documented
  surface for freelance invoice verification and Plunet TMS automation
  covering customers, freelancers, invoices, orders, purchase orders, quotes,
  and order templates.
